services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mediamerge
      POSTGRES_USER: mediamerge
      POSTGRES_PASSWORD: mediamerge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: change-me-in-production
      POSTGRES_DB: mediamerge
      POSTGRES_USER: mediamerge
      POSTGRES_PASSWORD: mediamerge
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: mediamerge
      MINIO_SECURE: "False"
      DRM_MASTER_KEY: change-this-development-key
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  celery:
    build: .
    command: celery -A config worker -l info
    environment:
      DEBUG: "True"
      SECRET_KEY: change-me-in-production
      POSTGRES_DB: mediamerge
      POSTGRES_USER: mediamerge
      POSTGRES_PASSWORD: mediamerge
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: mediamerge
      MINIO_SECURE: "False"
      DRM_MASTER_KEY: change-this-development-key
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres_data:
  minio_data:
